name: Copper Equilibrium Daily Update

on:
  push:
    branches:
      - main
    paths:
      - "copper/**"
      - ".github/workflows/copper-daily-update.yml"
  schedule:
    - cron: "5 21 * * *"
  workflow_dispatch:

concurrency:
  group: copper-equilibrium-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-copper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile sources
        run: python -m compileall -q copper/src

      - name: Update latest copper equilibrium data
        shell: bash
        run: |
          for attempt in 1 2 3; do
            python copper/src/update_copper.py && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done

      - name: Commit refreshed outputs
        run: |
          git config user.name "copper-equilibrium-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/copper/data/latest.json docs/index.html
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "chore(copper): daily equilibrium refresh"
            git push origin HEAD:main
          fi
