name: Copper Equilibrium Daily Update

on:
  push:
    branches:
      - main
    paths:
      - "copper/**"
      - ".github/workflows/copper-daily-update.yml"
  schedule:
    - cron: "5 21 * * *"
  workflow_dispatch:

concurrency:
  group: copper-equilibrium-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-copper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile sources
        run: python -m compileall -q copper/src
      - name: Calibrate strict benchmark-aware weekly market model
        shell: bash
        run: |
          for attempt in 1 2 3; do
            python copper/src/calibrate_copper_weekly.py && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done
      - name: Update latest copper data
        run: python copper/src/update_copper.py
      - name: Enforce strict publication gate
        run: python copper/src/apply_publication_gate.py
      - name: Commit refreshed outputs
        run: |
          git config user.name "copper-equilibrium-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/copper/data/weekly_calibration.json docs/copper/data/latest.json docs/index.html
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "chore(copper): strict-governance daily refresh"
            git pull --rebase origin main
            git push origin main
          fi
