name: Deploy Copper Site to Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows:
      - Copper Equilibrium Daily Update
    types:
      - completed
  schedule:
    - cron: "50 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copper-pages
  cancel-in-progress: true

jobs:
  check-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            cat /tmp/pages.json
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled yet (HTTP $code). Deployment will be skipped safely."
          fi

  deploy:
    needs: check-pages
    if: >-
      ${{ needs.check-pages.outputs.enabled == 'true' &&
          (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
