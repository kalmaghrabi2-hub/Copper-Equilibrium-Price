name: Gold Equilibrium Daily Update

on:
  push:
    branches: [gold-equilibrium-v1]
  schedule:
    - cron: "20 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r gold/requirements.txt

      - name: Calibrate macro fair-value model
        run: python gold/src/calibrate.py

      - name: Update market and fundamentals
        run: python gold/src/update_gold.py

      - name: Render site
        run: python gold/src/render_site.py

      - name: Commit refreshed outputs
        run: |
          git config user.name "gold-equilibrium-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gold/model/model.json docs/gold/data/latest.json docs/gold/data/history.jsonl docs/gold/index.md
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "chore(gold): refresh model and site [skip ci]"
            git push
          fi
